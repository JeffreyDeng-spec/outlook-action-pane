name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Locate OpenSSL for the loopback TLS test
        shell: pwsh
        run: |
          $exe = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (!$exe) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
            $exe = (Resolve-Path (Join-Path $gitRoot 'usr/bin/openssl.exe')).Path
          }
          "OUTLOOK_TRIAGE_OPENSSL=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: python tools/check_public_tree.py
      - run: python -B -m unittest discover -p "test_*.py"
      - run: python -m pip install playwright==1.58.0
      - name: Exercise the narrow pane through the authenticated test bridge
        run: python -B verify_action_pane.py --channel msedge
